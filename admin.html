<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Admin - Mobil Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #f8fafc; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="app-container pb-10">
        
        <!-- Header -->
        <div class="bg-gray-900 text-white p-5 text-center rounded-b-3xl shadow-lg">
            <h1 class="font-black text-xl text-green-400"><i class="fas fa-user-shield"></i> DASHBOARD ADMIN</h1>
            <p class="text-xs text-gray-300 mt-1">Pusat Kendali Papan Orderan (Realtime)</p>
        </div>

        <div class="p-5 mt-2">
            
            <!-- Kotak Input Orderan -->
            <div class="bg-white rounded-xl shadow-sm p-4 border border-blue-200 mb-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                <label class="text-xs text-gray-500 font-bold uppercase mb-2 block"><i class="fas fa-paste text-blue-500"></i> 1. Paste Pesan Pelanggan</label>
                <textarea id="boxPaste" rows="5" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm text-gray-700 outline-none focus:border-blue-500" placeholder="Paste pesan WA dari pelanggan di sini..."></textarea>
                <button onclick="prosesTeks()" class="w-full mt-3 bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 active:scale-95 transition">
                    <i class="fas fa-cloud-upload-alt"></i> TEMPEL KE PAPAN PENGUMUMAN
                </button>
            </div>

            <!-- Tombol Bagikan ke WA -->
            <button onclick="bagikanKeGrup()" class="w-full bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-600 active:scale-95 transition flex items-center justify-center gap-2 text-lg mb-8">
                <i class="fab fa-whatsapp text-2xl"></i> SHARE INFO KE GRUP DRIVER
            </button>

            <!-- Daftar Orderan Aktif di Database -->
            <div class="bg-gray-100 rounded-xl p-4 border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider"><i class="fas fa-list-ul"></i> Menunggu Driver (Aktif)</h2>
                    <span class="flex h-3 w-3 relative">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                </div>
                <p class="text-[10px] text-gray-500 mb-3">Daftar di bawah ini sedang diperebutkan di HP seluruh Driver. Akan otomatis hilang jika ada yang mengambil.</p>
                
                <div id="daftarOrderan" class="space-y-3">
                    <p class="text-xs text-gray-400 text-center italic py-4">Memuat dari database...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- KODE PENGHUBUNG FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Kunci Rahasia Anda
        const firebaseConfig = {
            apiKey: "AIzaSyD3LNakfEQDlpwp1RC4OBsF6GoEQ934ERo",
            authDomain: "mobil-online-spps.firebaseapp.com",
            databaseURL: "https://mobil-online-spps-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mobil-online-spps",
            storageBucket: "mobil-online-spps.firebasestorage.app",
            messagingSenderId: "1050149242293",
            appId: "1:1050149242293:web:ecbc568efd37e5090445fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.linkDriver = window.location.href.split('?')[0].replace('admin.html', 'driver.html');

        window.prosesTeks = function() {
            let teks = document.getElementById('boxPaste').value;
            try {
                let jemput = teks.match(/📍 \*Jemput:\* (.*)/)[1];
                let tujuan = teks.match(/🏁 \*Tujuan:\* (.*)/)[1];
                let jarak = teks.match(/🛣 \*Jarak:\* (.*) KM/)[1];
                let tarifKotor = teks.match(/💰 \*Tarif:\* \*Rp (.*)\*/)[1];
                let tarifAngka = tarifKotor.replace(/\./g, '');

                const orderRef = push(ref(db, 'orderan_aktif'));
                set(orderRef, {
                    jemput: jemput,
                    tujuan: tujuan,
                    jarak: jarak,
                    tarif: tarifAngka,
                    status: 'menunggu',
                    waktu: new Date().getTime()
                }).then(() => {
                    alert("✅ BERHASIL! Orderan telah masuk ke Papan Pengumuman Driver.");
                    document.getElementById('boxPaste').value = ""; 
                }).catch((error) => {
                    alert("❌ Gagal menyimpan ke database. Cek koneksi internet.");
                });
            } catch (error) {
                alert("❌ Gagal membaca teks! Pastikan Anda mem-paste pesan WA dari pelanggan secara utuh.");
            }
        };

        window.bagikanKeGrup = function() {
            let teksGrup = `🚨 *ADA ORDERAN BARU, CEK SEKARANG!* 🚨\n\nKlik link tetap ini untuk melihat daftar orderan:\n👇👇👇\n${window.linkDriver}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(teksGrup)}`, '_blank');
        };

        window.hapusOrderan = function(id) {
            if(confirm("Hapus orderan ini secara manual dari sistem?")) {
                remove(ref(db, 'orderan_aktif/' + id));
            }
        };

        onValue(ref(db, 'orderan_aktif'), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('daftarOrderan');
            container.innerHTML = ''; 

            if (data) {
                Object.keys(data).forEach(key => {
                    let order = data[key];
                    let item = `
                    <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm relative transition-all">
                        <p class="text-[11px] text-gray-500 font-bold mb-1 uppercase">📍 Jemput: <span class="text-gray-800 normal-case">${order.jemput}</span></p>
                        <p class="text-[11px] text-gray-500 font-bold mb-3 uppercase">🏁 Tujuan: <span class="text-gray-800 normal-case">${order.tujuan}</span></p>
                        <div class="flex justify-between items-center border-t border-gray-100 pt-2">
                            <span class="text-sm font-black text-red-600">Rp ${Number(order.tarif).toLocaleString('id-ID')}</span>
                            <button onclick="hapusOrderan('${key}')" class="bg-gray-100 text-gray-500 px-3 py-1.5 rounded text-[10px] font-bold hover:bg-red-100 hover:text-red-600 transition">
                                <i class="fas fa-times"></i> Tarik
                            </button>
                        </div>
                    </div>`;
                    container.innerHTML += item;
                });
            } else {
                container.innerHTML = '<p class="text-xs text-gray-400 text-center italic py-4">Papan orderan sedang kosong.</p>';
            }
        });
    </script>
</body>
</html>
