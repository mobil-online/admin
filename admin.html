<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Admin - Mobil Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #f8fafc; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container pb-10">
        
        <!-- Header & Navigasi Tab -->
        <div class="bg-gray-900 text-white rounded-b-3xl shadow-lg overflow-hidden sticky top-0 z-50">
            <div class="p-5 text-center">
                <h1 class="font-black text-xl text-green-400"><i class="fas fa-user-shield"></i> DASHBOARD ADMIN</h1>
                <p class="text-xs text-gray-300 mt-1">Pusat Kendali Mobil Online</p>
            </div>
            <div class="flex border-t border-gray-700">
                <button onclick="bukaTab('orderan')" id="tabOrderan" class="flex-1 py-3 text-sm font-bold bg-gray-800 text-white border-b-4 border-blue-500 transition-all">
                    <i class="fas fa-clipboard-list"></i> Papan Order
                </button>
                <button onclick="bukaTab('laporan')" id="tabLaporan" class="flex-1 py-3 text-sm font-bold bg-gray-900 text-gray-400 border-b-4 border-transparent hover:text-white transition-all">
                    <i class="fas fa-chart-line"></i> Laporan
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- TAB 1: PAPAN ORDERAN                       -->
        <!-- ========================================== -->
        <div id="view-orderan" class="p-5 mt-2">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-blue-200 mb-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                <label class="text-xs text-gray-500 font-bold uppercase mb-2 block"><i class="fas fa-paste text-blue-500"></i> 1. Paste Pesan Pelanggan</label>
                <textarea id="boxPaste" rows="5" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm text-gray-700 outline-none focus:border-blue-500" placeholder="Paste pesan WA dari pelanggan di sini..."></textarea>
                <button onclick="prosesTeks()" class="w-full mt-3 bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 active:scale-95 transition">
                    <i class="fas fa-cloud-upload-alt"></i> TEMPEL KE PAPAN PENGUMUMAN
                </button>
            </div>

            <button onclick="bagikanKeGrup()" class="w-full bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-600 active:scale-95 transition flex items-center justify-center gap-2 text-lg mb-8">
                <i class="fab fa-whatsapp text-2xl"></i> SHARE INFO KE GRUP DRIVER
            </button>

            <div class="bg-gray-100 rounded-xl p-4 border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider"><i class="fas fa-list-ul"></i> Menunggu Driver (Aktif)</h2>
                    <span class="flex h-3 w-3 relative">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                </div>
                <div id="daftarOrderan" class="space-y-3">
                    <p class="text-xs text-gray-400 text-center italic py-4">Memuat dari database...</p>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- TAB 2: LAPORAN KEUANGAN & KINERJA DRIVER   -->
        <!-- ========================================== -->
        <div id="view-laporan" class="p-5 mt-2 hidden">
            
            <h2 class="font-bold text-gray-800 mb-4 text-center">Rekap Pendapatan Otomatis</h2>

            <!-- KOTAK BULANAN (Disatukan biar rapi) -->
            <div class="bg-white rounded-xl shadow-sm border-l-4 border-yellow-500 p-4 mb-6">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2">
                    <h3 class="font-bold text-yellow-600 text-sm uppercase">OMZET BULAN INI</h3>
                    <span class="text-[10px] text-gray-400" id="tglBulanIni">-</span>
                </div>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs text-gray-500">Total Perputaran Uang:</span>
                    <span class="text-sm font-bold text-gray-800" id="omzetBulanan">Rp 0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-green-600">Laba Bersih Admin (10%):</span>
                    <span class="text-lg font-black text-green-600" id="labaBulanan">Rp 0</span>
                </div>
            </div>

            <!-- LAPORAN PER DRIVER -->
            <div class="mb-8">
                <h3 class="font-bold text-gray-800 mb-3 text-sm border-b pb-2"><i class="fas fa-trophy text-yellow-500"></i> Kinerja Driver (Bulan Ini)</h3>
                <div id="kinerjaDriver" class="space-y-3">
                    <!-- List Driver akan diinjeksi via JS -->
                </div>
            </div>

            <!-- RIWAYAT TRANSAKSI -->
            <div>
                <h3 class="font-bold text-gray-800 mb-3 text-sm border-b pb-2"><i class="fas fa-history text-gray-500"></i> Semua Riwayat Orderan</h3>
                <div id="riwayatLaporan" class="space-y-3">
                    <!-- Riwayat orderan diinjeksi via JS -->
                </div>
            </div>

        </div>

    </div>

    <!-- KODE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3LNakfEQDlpwp1RC4OBsF6GoEQ934ERo",
            authDomain: "mobil-online-spps.firebaseapp.com",
            databaseURL: "https://mobil-online-spps-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mobil-online-spps",
            storageBucket: "mobil-online-spps.firebasestorage.app",
            messagingSenderId: "1050149242293",
            appId: "1:1050149242293:web:ecbc568efd37e5090445fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.linkDriver = window.location.href.split('?')[0].replace('admin.html', 'driver.html');

        window.bukaTab = function(namaTab) {
            if(namaTab === 'orderan') {
                document.getElementById('view-orderan').classList.remove('hidden');
                document.getElementById('view-laporan').classList.add('hidden');
                document.getElementById('tabOrderan').className = "flex-1 py-3 text-sm font-bold bg-gray-800 text-white border-b-4 border-blue-500 transition-all";
                document.getElementById('tabLaporan').className = "flex-1 py-3 text-sm font-bold bg-gray-900 text-gray-400 border-b-4 border-transparent hover:text-white transition-all";
            } else {
                document.getElementById('view-orderan').classList.add('hidden');
                document.getElementById('view-laporan').classList.remove('hidden');
                document.getElementById('tabLaporan').className = "flex-1 py-3 text-sm font-bold bg-gray-800 text-white border-b-4 border-blue-500 transition-all";
                document.getElementById('tabOrderan').className = "flex-1 py-3 text-sm font-bold bg-gray-900 text-gray-400 border-b-4 border-transparent hover:text-white transition-all";
            }
        }

        window.prosesTeks = function() {
            let teks = document.getElementById('boxPaste').value;
            try {
                let jemput = teks.match(/\*Jemput:\*\s*(.*)/)[1];
                let tujuan = teks.match(/\*Tujuan:\*\s*(.*)/)[1];
                let jarak = teks.match(/\*Jarak:\*\s*(.*)\s*KM/i)[1];
                let tarifKotor = teks.match(/\*Tarif:\*\s*\*Rp\s*(.*)\*/)[1];
                let tarifAngka = tarifKotor.replace(/\./g, '').trim();

                const orderRef = push(ref(db, 'orderan_aktif'));
                set(orderRef, {
                    jemput: jemput.trim(),
                    tujuan: tujuan.trim(),
                    jarak: jarak.trim(),
                    tarif: tarifAngka,
                    status: 'menunggu',
                    waktu: new Date().getTime()
                }).then(() => {
                    alert("✅ BERHASIL! Orderan telah masuk ke Papan Pengumuman.");
                    document.getElementById('boxPaste').value = ""; 
                }).catch((error) => { alert("❌ Gagal menyimpan."); });
            } catch (error) { alert("❌ Gagal membaca teks! Pastikan format utuh dari Web Pelanggan."); }
        };

        window.bagikanKeGrup = function() {
            let teksGrup = `🚨 *ADA ORDERAN BARU, CEK SEKARANG!* 🚨\n\nKlik link di bawah ini:\n👇👇👇\n${window.linkDriver}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(teksGrup)}`, '_blank');
        };

        window.hapusOrderan = function(id) {
            if(confirm("Tarik orderan ini secara manual dari sistem?")) remove(ref(db, 'orderan_aktif/' + id));
        };
        window.hapusLaporan = function(id) {
            if(confirm("Hapus data laporan ini? Total keuangan akan otomatis berkurang.")) remove(ref(db, 'laporan_selesai/' + id));
        };

        onValue(ref(db, 'orderan_aktif'), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('daftarOrderan');
            container.innerHTML = ''; 
            if (data) {
                Object.keys(data).forEach(key => {
                    let order = data[key];
                    container.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm relative">
                        <p class="text-[11px] text-gray-500 font-bold mb-1 uppercase">📍 Jemput: <span class="text-gray-800 normal-case">${order.jemput}</span></p>
                        <p class="text-[11px] text-gray-500 font-bold mb-3 uppercase">🏁 Tujuan: <span class="text-gray-800 normal-case">${order.tujuan}</span></p>
                        <div class="flex justify-between items-center border-t border-gray-100 pt-2">
                            <span class="text-sm font-black text-red-600">Rp ${Number(order.tarif).toLocaleString('id-ID')}</span>
                            <button onclick="hapusOrderan('${key}')" class="bg-gray-100 text-gray-500 px-3 py-1.5 rounded text-[10px] font-bold hover:bg-red-100 hover:text-red-600 transition">
                                <i class="fas fa-times"></i> Tarik
                            </button>
                        </div>
                    </div>`;
                });
            } else { container.innerHTML = '<p class="text-xs text-gray-400 text-center italic py-4">Papan orderan sedang kosong.</p>'; }
        });

        // BACA LAPORAN & KALKULASI DRIVER
        onValue(ref(db, 'laporan_selesai'), (snapshot) => {
            const data = snapshot.val();
            let omzetBulan = 0, labaBulan = 0;
            let statsDriver = {}; // Menyimpan rapor per driver
            
            const now = new Date();
            const blnIni = now.getMonth();
            const thnIni = now.getFullYear();

            document.getElementById('tglBulanIni').innerText = now.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
            
            const listRiwayat = document.getElementById('riwayatLaporan');
            const listKinerja = document.getElementById('kinerjaDriver');
            listRiwayat.innerHTML = '';
            listKinerja.innerHTML = '';
            
            let arrRiwayat = [];

            if (data) {
                Object.keys(data).forEach(key => {
                    let trx = data[key];
                    trx.id = key;
                    arrRiwayat.push(trx);
                    
                    if (trx.status !== 'batal') {
                        let d = new Date(trx.waktu);
                        let tarif = parseInt(trx.tarif) || 0;
                        let potongan = parseInt(trx.potongan) || 0;

                        if(d.getFullYear() === thnIni && d.getMonth() === blnIni) {
                            omzetBulan += tarif; 
                            labaBulan += potongan;
                            
                            // Hitung Rapor Perorangan Driver
                            let namaDrv = trx.driverInisial || "Driver Lama (Tanpa Nama)";
                            if(!statsDriver[namaDrv]) statsDriver[namaDrv] = { totalTrip: 0, setoranAdmin: 0 };
                            
                            statsDriver[namaDrv].totalTrip += 1;
                            statsDriver[namaDrv].setoranAdmin += potongan;
                        }
                    }
                });
                
                arrRiwayat.sort((a, b) => b.waktu - a.waktu);
                
                // CETAK RIWAYAT TRANSAKSI BAWAH
                arrRiwayat.forEach(trx => {
                    let d = new Date(trx.waktu);
                    let wkt = d.toLocaleDateString('id-ID') + ' ' + d.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                    let bgWarna = trx.status === 'batal' ? 'bg-red-50 border-red-200' : 'bg-white border-gray-200';
                    let badge = trx.status === 'batal' ? '<span class="text-[9px] bg-red-100 text-red-600 px-2 py-1 rounded font-bold">BATAL</span>' : '<span class="text-[9px] bg-green-100 text-green-600 px-2 py-1 rounded font-bold">SUKSES</span>';
                    let ruteStr = (trx.jemput) + ' ➔ ' + (trx.tujuan);
                    let nmDrv = trx.driverInisial || "Anonim";

                    listRiwayat.innerHTML += `
                    <div class="${bgWarna} border rounded-lg p-3 shadow-sm relative">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1 pr-2">
                                <p class="text-[10px] text-gray-500 mb-0.5">${wkt} • <span class="font-bold text-blue-600">🚗 ${nmDrv}</span></p>
                                <p class="text-xs font-semibold text-gray-800 line-clamp-1">${ruteStr}</p>
                            </div>
                            <div>${badge}</div>
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-100 border-dashed pt-2">
                            <p class="text-[10px] text-gray-500 font-bold">Tarif: Rp ${Number(trx.tarif).toLocaleString('id-ID')}</p>
                            <button onclick="hapusLaporan('${trx.id}')" class="text-[10px] text-gray-400 hover:text-red-500 transition"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>`;
                });

                // CETAK KINERJA DRIVER
                let adaDriverBulanIni = false;
                Object.keys(statsDriver).sort((a,b) => statsDriver[b].totalTrip - statsDriver[a].totalTrip).forEach(nama => {
                    adaDriverBulanIni = true;
                    let stat = statsDriver[nama];
                    listKinerja.innerHTML += `
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-xs shadow-sm">${nama.substring(0,2).toUpperCase()}</div>
                            <div>
                                <p class="font-bold text-gray-800 text-sm">${nama}</p>
                                <p class="text-[10px] text-gray-500">${stat.totalTrip} Trip Sukses</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-gray-500">Setoran ke Admin</p>
                            <p class="font-black text-blue-600 text-sm">Rp ${stat.setoranAdmin.toLocaleString('id-ID')}</p>
                        </div>
                    </div>`;
                });
                
                if(!adaDriverBulanIni) listKinerja.innerHTML = '<p class="text-xs text-gray-400 italic">Belum ada orderan sukses bulan ini.</p>';
                
            } else {
                listRiwayat.innerHTML = '<p class="text-xs text-gray-400 text-center italic py-4">Belum ada riwayat transaksi.</p>';
                listKinerja.innerHTML = '<p class="text-xs text-gray-400 text-center italic py-4">Belum ada data driver.</p>';
            }

            document.getElementById('omzetBulanan').innerText = "Rp " + omzetBulan.toLocaleString('id-ID');
            document.getElementById('labaBulanan').innerText = "Rp " + labaBulan.toLocaleString('id-ID');
        });
    </script>
</body>
</html>
