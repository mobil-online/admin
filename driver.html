<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Papan Orderan - Mobil Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #f8fafc; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="app-container pb-10">
        
        <!-- Header -->
        <div class="bg-gray-900 text-white p-5 text-center rounded-b-3xl shadow-lg relative overflow-hidden sticky top-0 z-50">
            <div class="absolute -right-5 -top-5 opacity-10">
                <i class="fas fa-car text-[100px]"></i>
            </div>
            <div class="relative z-10">
                <h1 class="font-black text-xl uppercase tracking-widest text-yellow-400 drop-shadow-md">
                    <i class="fas fa-satellite-dish animate-pulse"></i> BURSA ORDERAN
                </h1>
                <p class="text-xs text-gray-300 mt-1">Siapa cepat, dia dapat! Realtime Database.</p>
            </div>
        </div>

        <div class="p-5 mt-2">
            <!-- Tempat daftar orderan akan muncul -->
            <div id="daftarOrderanDriver" class="space-y-6">
                <!-- Tampilan Loading (Sebelum Terhubung) -->
                <div class="text-center mt-10">
                    <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
                    <p class="text-gray-500 font-medium">Menghubungkan ke Papan Pengumuman...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- KODE PENGHUBUNG FIREBASE (Untuk Membaca Orderan) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Kunci Rahasia Database Anda
        const firebaseConfig = {
            apiKey: "AIzaSyD3LNakfEQDlpwp1RC4OBsF6GoEQ934ERo",
            authDomain: "mobil-online-spps.firebaseapp.com",
            databaseURL: "https://mobil-online-spps-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mobil-online-spps",
            storageBucket: "mobil-online-spps.firebasestorage.app",
            messagingSenderId: "1050149242293",
            appId: "1:1050149242293:web:ecbc568efd37e5090445fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Nomor WhatsApp Anda (Admin)
        const NOMOR_WA_ADMIN = "6282122227535"; 

        window.formatRupiah = function(angka) { 
            return "Rp " + Number(angka).toLocaleString('id-ID'); 
        };

        // Fungsi saat tombol Ambil ditekan
        window.ambilOrderan = function(jemput, tujuan, tarifKotor) {
            let teksDriver = `Bos Admin, saya siap ambil orderan ini! 🚘\n\n📍 *Jemput:* ${jemput}\n🏁 *Tujuan:* ${tujuan}\n💰 *Tarif:* ${window.formatRupiah(tarifKotor)}\n\nTolong berikan nomor HP penumpangnya bos.`;
            let urlWA = `https://wa.me/${NOMOR_WA_ADMIN}?text=${encodeURIComponent(teksDriver)}`;
            window.open(urlWA, '_blank');
        };

        // MENDENGARKAN PERUBAHAN DATABASE SECARA REALTIME
        onValue(ref(db, 'orderan_aktif'), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('daftarOrderanDriver');
            container.innerHTML = ''; // Kosongkan layar dulu

            if (data) {
                // Balikkan urutan agar orderan terbaru muncul paling atas
                const daftarKeys = Object.keys(data).reverse(); 

                daftarKeys.forEach(key => {
                    let order = data[key];
                    
                    // Hitung Matematika Potongan
                    let tarifAngka = parseInt(order.tarif);
                    let potonganAdmin = tarifAngka * 0.10;
                    let bersihDriver = tarifAngka - potonganAdmin;

                    // Buat Kotak Orderan
                    let item = `
                    <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
                        <!-- Rute -->
                        <div class="p-4 border-b border-gray-100">
                            <div class="flex items-start mb-3">
                                <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center text-[10px] mr-3 mt-0.5"><i class="fas fa-map-marker-alt"></i></div>
                                <div>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Penjemputan</p>
                                    <p class="font-bold text-gray-800 text-sm">${order.jemput}</p>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <div class="w-6 h-6 rounded-full bg-red-100 text-red-500 flex items-center justify-center text-[10px] mr-3 mt-0.5"><i class="fas fa-flag-checkered"></i></div>
                                <div>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Tujuan</p>
                                    <p class="font-bold text-gray-800 text-sm">${order.tujuan}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Info & Pendapatan -->
                        <div class="bg-[#fefce8] p-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs text-gray-600 font-medium">Jarak & Tarif Pelanggan</span>
                                <span class="text-sm font-bold text-gray-800">${order.jarak} KM | ${window.formatRupiah(tarifAngka)}</span>
                            </div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[11px] font-semibold text-red-500 bg-red-50 px-2 py-0.5 rounded">Potongan Admin 10%</span>
                                <span class="text-sm font-bold text-red-500">- ${window.formatRupiah(potonganAdmin)}</span>
                            </div>
                            <div class="flex justify-between items-center mt-3 pt-2 border-t border-yellow-200 border-dashed">
                                <span class="text-xs font-bold text-green-700 uppercase">Bersih Driver</span>
                                <span class="text-lg font-black text-green-600">${window.formatRupiah(bersihDriver)}</span>
                            </div>
                        </div>

                        <!-- Tombol Ambil -->
                        <div class="p-3 bg-gray-50">
                            <button onclick="ambilOrderan('${order.jemput.replace(/'/g, "\\'")}', '${order.tujuan.replace(/'/g, "\\'")}', ${tarifAngka})" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow hover:bg-green-600 active:scale-95 transition-all flex items-center justify-center gap-2">
                                <i class="fab fa-whatsapp text-xl"></i> AMBIL ORDERAN INI
                            </button>
                        </div>
                    </div>`;
                    container.innerHTML += item;
                });
            } else {
                // Jika database kosong
                container.innerHTML = `
                <div class="text-center mt-12 bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                    <i class="fas fa-mug-hot text-5xl text-gray-300 mb-4 block"></i>
                    <h3 class="font-bold text-gray-700 text-lg">Belum Ada Orderan</h3>
                    <p class="text-xs text-gray-500 mt-2">Silakan bersantai sejenak. Jika ada orderan baru, akan langsung muncul di sini otomatis.</p>
                </div>`;
            }
        });
    </script>
</body>
</html>
